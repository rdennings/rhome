name: CI

# Builds rhome and runs the tests on Linux, so a platform dependency sneaking into the core breaks the build right
# away (PLAN.md §4, risk R8). The Linux job builds Rhome.Portable.slnf, everything but the Android head, so it needs
# no Android workload. The Android job builds the APK; on pushes to main it uploads it as a workflow artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Rhome.Portable.slnf

      - name: Build
        run: dotnet build Rhome.Portable.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Rhome.Portable.slnf --configuration Release --no-build

  android:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Install the Android SDK parts the build needs
        run: >
          dotnet build src/Rhome.Android -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # No keystore is given, so the APK is signed with this runner's own debug key, which changes every run.
      # These APKs are for testing only: installing a later one over it means uninstalling first, which deletes
      # the bank in the app's storage. Signed releases are #84.
      - name: Publish
        run: dotnet publish src/Rhome.Android --configuration Release -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Upload the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rhome-android-${{ github.sha }}
          path: src/Rhome.Android/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 30
